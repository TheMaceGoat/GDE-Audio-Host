<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDE Audio Upload Host</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>GDE Audio Upload Host</h1>
    <p>Upload an audio file and get a direct URL you can paste into GDE</p>

    <form id="upload-form">
      <label for="audio-file">Choose audio file</label>
      <input id="audio-file" type="file" name="audio" accept="audio/*" required />
      <!-- Disabled by default until the module script loads completely -->
      <button id="submit-btn" type="submit" disabled>Loading uploader...</button>
    </form>

    <div id="result" class="hidden">
      <p>Direct file URL:</p>
      <input id="file-url" type="text" readonly />
      <button id="copy-button">Copy Link</button>
      <p class="hint">Paste this URL into GDE</p>
    </div>

    <div id="message" class="hidden"></div>

    <section id="gallery-section">
      <h2>Recent uploads</h2>
      <div class="search-bar">
        <input id="search-input" type="search" placeholder="Search uploads by filename..." />
      </div>
      <div id="upload-list" class="upload-list"></div>
    </section>
  </main>

  <script type="module">
    const form = document.getElementById('upload-form');
    const submitBtn = document.getElementById('submit-btn');
    const result = document.getElementById('result');
    const fileUrlInput = document.getElementById('file-url');
    const message = document.getElementById('message');
    const copyButton = document.getElementById('copy-button');
    const uploadList = document.getElementById('upload-list');
    const searchInput = document.getElementById('search-input');
    let allUploads = [];
    let upload;

    function setMessage(text, type = 'info') {
      message.textContent = text;
      message.className = type;
      message.classList.remove('hidden');
    }

    function formatSize(size) {
      if (size >= 1024 * 1024) return `${(size / (1024 * 1024)).toFixed(2)} MB`;
      if (size >= 1024) return `${(size / 1024).toFixed(1)} KB`;
      return `${size} B`;
    }

    function timeAgo(timestamp) {
      const diff = Date.now() - new Date(timestamp).getTime();
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      if (days >= 1) return `${days} day${days === 1 ? '' : 's'} ago`;
      if (hours >= 1) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
      if (minutes >= 1) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
      return 'just now';
    }

    function renderUploads(uploads) {
      if (!uploads.length) {
        uploadList.innerHTML = '<p class="empty-list">No uploaded audio yet.</p>';
        return;
      }

      uploadList.replaceChildren(...uploads.map((item) => {
        const card = document.createElement('article');
        card.className = 'upload-card';

        const header = document.createElement('div');
        header.className = 'upload-card-header';
        const details = document.createElement('div');
        const name = document.createElement('strong');
        name.textContent = item.originalName;
        const meta = document.createElement('p');
        meta.className = 'upload-meta';
        meta.textContent = `${formatSize(item.size)} · ${timeAgo(item.uploadedAt)}`;
        details.append(name, meta);

        const actions = document.createElement('div');
        actions.className = 'upload-card-actions';
        const copyButton = document.createElement('button');
        copyButton.className = 'copy-upload-link';
        copyButton.textContent = 'Copy URL';
        copyButton.addEventListener('click', () => {
          navigator.clipboard.writeText(item.url).then(() => {
            setMessage('Copied upload link to clipboard!', 'success');
          }).catch(() => {
            setMessage('Unable to copy link. Please copy manually.', 'error');
          });
        });
        actions.append(copyButton);
        header.append(details, actions);

        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'none';
        audio.src = item.url;
        const linkRow = document.createElement('div');
        linkRow.className = 'upload-link-row';
        const linkInput = document.createElement('input');
        linkInput.type = 'text';
        linkInput.readOnly = true;
        linkInput.value = item.url;
        linkRow.append(linkInput);
        card.append(header, audio, linkRow);
        return card;
      }));
    }

    function filterUploads(query) {
      const normalized = query.trim().toLowerCase();
      if (!normalized) {
        renderUploads(allUploads);
        return;
      }

      const filtered = allUploads.filter((item) =>
        item.originalName.toLowerCase().includes(normalized)
      );

      if (!filtered.length) {
        uploadList.innerHTML = '<p class="empty-list">No uploads match your search.</p>';
        return;
      }

      renderUploads(filtered);
    }

    async function fetchUploads() {
      try {
        const response = await fetch('/uploads.json');
        if (!response.ok) {
          throw new Error('Could not fetch uploads.');
        }
        allUploads = await response.json();
        renderUploads(allUploads);
      } catch (error) {
        uploadList.innerHTML = '<p class="empty-list error">Unable to load previous uploads.</p>';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.classList.add('hidden');
      message.classList.add('hidden');

      const fileInput = document.getElementById('audio-file');
      if (!fileInput.files.length) {
        setMessage('Please select an audio file to upload.', 'error');
        return;
      }

      // FIX: Grab the explicit file item object [0] inside the FileList array
      const targetFile = fileInput.files[0];
      setMessage('Uploading directly to cloud storage...', 'info');

      try {
        // Upload directly from browser to Vercel Blob
        const blob = await upload(targetFile.name, targetFile, {
          access: 'public',
          handleUploadUrl: '/api/upload',
        });

        // Pass generated cloud asset link to database endpoint to record transaction
        const metadataResponse = await fetch('/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            originalName: targetFile.name,
            size: targetFile.size,
            mimeType: targetFile.type || 'audio/mpeg',
            url: blob.url
          })
        });

        const data = await metadataResponse.json();
        if (!metadataResponse.ok) {
          throw new Error(data.error || 'Metadata registration failed.');
        }

        fileUrlInput.value = data.url;
        result.classList.remove('hidden');
        setMessage(data.duplicate ? 'This file already exists; using the existing link.' : 'Upload complete! Your URL is ready.', 'success');
        
        form.reset();
        await fetchUploads();
      } catch (error) {
        setMessage(error.message || 'Upload failed. Please try again.', 'error');
      }
    });

    import('https://esm.sh/@vercel/blob@2.4.0/client').then((blobClient) => {
      upload = blobClient.upload;
      submitBtn.textContent = 'Upload';
      submitBtn.disabled = false;
    }).catch(() => {
      submitBtn.textContent = 'Uploader unavailable';
      setMessage('Unable to load the upload helper. Please refresh and try again.', 'error');
    });

    copyButton.addEventListener('click', () => {
      navigator.clipboard.writeText(fileUrlInput.value).then(() => {
        setMessage('Copied to clipboard!', 'success');
      }).catch(() => {
        setMessage('Unable to copy link. Please copy manually.', 'error');
      });
    });

    searchInput.addEventListener('input', () => {
      filterUploads(searchInput.value);
    });

    fetchUploads();
  </script>
</body>
</html>
